    <style>
       
            /*color del cuadro superioyr*/ 
header{height:72px;display:flex;align-items:center; justify-content: space-between;gap:20px; position:sticky;top:0;z-index:20;background:rgba(7,8,12,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
 /*botones*/
  .btn.primary{background:linear-gradient(135deg,var(--accent),#6248db);border-color:transparent}    
          /* Estilos generales básicos */
        body {
              margin: 0;
     background: #030250;
    color: #3aad17;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .brand{ 
         color: #eceef3;
         display:flex;
        align-items:center;
        margin-left:48px;
         gap:11px;
         font-weight:900;
        font-size:22px;
         letter-spacing:.3px;
         text-decoration: none;
}
.logo{width:55px;height:55px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#000000);display:grid;place-items:center;box-shadow:0 8px 28px rgba(124,92,255,.28)}



        /* 1. Barra de Navegación */
        .navbar {
            background-color: #d1ce10;
            padding: 15px 20px;
            border-bottom: 2px solid #132b7c;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        .navbar li a {
            color: #00865963;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .navbar li a:hover {
            color: #00ff88;
        }

        /* 2. Estilo del rectángulo deslizable (Carrusel) */
        .carrusel-contenedor {
            width: 80%;           /* Ancho del rectángulo */
            max-width: 900px;     /* Tamaño máximo para que no se estire de más */
            height: 350px;        /* Altura del rectángulo largo */
            margin: 30px auto;    /* Centrado en la pantalla */
            overflow: hidden;     /* Oculta las imágenes que no están en vista */
            border-radius: 10px;  /* Bordes redondeados modernos */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .carrusel-slides {
            display: flex;
            width: 300%;          /* Como son 3 imágenes, el ancho total es del 300% */
            height: 100%;
            animation: deslizar 12s infinite; /* Duración y repetición automática */
        }

        .slide {
            width: 100%;
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;    /* Asegura que la imagen cubra el rectángulo sin deformarse */
        }

        /* Animación automática para que las imágenes pasen solas */
        @keyframes deslizar {
            0% { transform: translateX(0%); }
            30% { transform: translateX(0%); }
            35% { transform: translateX(-33.33%); }
            65% { transform: translateX(-33.33%); }
            70% { transform: translateX(-66.66%); }
            95% { transform: translateX(-66.66%); }
            100% { transform: translateX(0%); }
        }

        /* Contenido de bienvenida debajo del carrusel */
        .bienvenida {
            text-align: center;
            padding: 20px;
        }
.nav-actions{display:flex;gap:10px}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:750;transition:.18s}
.btn:hover{transform:translateY(-1px);border-color:rgba(0, 241, 93, 0.18)}
    
    .eyebrow{color:#b7aaff;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1.6px}
h1{font-size:clamp(44px,7vw,78px);line-height:.95;margin:12px 0 20px;letter-spacing:-3px}
    </style>
    
</head>
