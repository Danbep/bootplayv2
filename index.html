<style>
  /* Estilos para la ventana emergente (Modal) */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  backdrop-filter: blur(5px);
  padding: 20px;
}
.modal-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}
.modal-box {
  background: var(--panel2);
  border: 1px solid var(--border);
  width: min(480px, 92vw);
  max-height: 85vh; /* Evita que se salga de la pantalla en celulares */
  border-radius: 20px;
  padding: 24px;
  position: relative;
  box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto; /* Activa la barra de desplazamiento general si el contenido es largo */
}
.modal-close {
  position: sticky; /* Se queda fija arriba a la derecha cuando haces scroll */
  top: 0;
  float: right;
  margin-left: auto;
  background: rgba(16, 19, 26, 0.8);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-weight: bold;
  z-index: 10; /* Asegura que la cruz esté siempre al frente de todo */
  backdrop-filter: blur(4px);
}
.modal-img-container {
  width: 100%;
  max-height: 280px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  display: grid;
  place-items: center;
  position: relative;
}
.modal-img-container img {
  width: 100%;
  height: auto;
  max-height: 280px;
  object-fit: contain; /* Cambiado a contain para que la imagen se vea COMPLETA sin recortarse */
}
.modal-title {
  font-size: 22px;
  font-weight: 850;
  margin: 0;
}
.modal-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
  margin: 0;
  max-height: 120px; /* Si el texto de la descripción es muy largo, genera su propia barra interna */
  overflow-y: auto;
  padding-right: 4px;
}
  .hero-card-hen {
  position: relative;
  overflow: hidden;
}
.hero-card-hen::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url('imagenes/HEN-logo.png'); /* Reemplaza con la ruta de tu logo */
  background-size: cover;
  background-position: center;
  opacity: 0.08; /* Esto controla qué tan difuminado/transparente se ve (de 0 a 1) */
  pointer-events: none;
  z-index: 0;
}
.hero-card-hen > * {
  position: relative;
  z-index: 1;
}
:root{
  --bg:#07080c; --panel:#10131a; --panel2:#151923; --text:#f4f6fb;
  --muted:#9ca3b0; --accent:#7c5cff; --accent2:#9b86ff;
  --border:rgba(255,255,255,.09); --ok:#45d483; --danger:#ff6574;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 15% -10%,#21194a 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,92%);margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(7,8,12,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:22px;letter-spacing:.3px}
.logo{width:55px;height:55px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#4d38b8);display:grid;place-items:center;box-shadow:0 8px 28px rgba(124,92,255,.28)}
.logo span{font-size:19px}
.nav-actions{display:flex;gap:10px}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:750;transition:.18s}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.18)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#6248db);border-color:transparent}
.hero{padding:74px 0 42px}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center}
.eyebrow{color:#b7aaff;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1.6px}
h1{font-size:clamp(44px,7vw,78px);line-height:.95;margin:12px 0 20px;letter-spacing:-3px}
.hero p{font-size:18px;line-height:1.6;color:var(--muted);max-width:680px}
.hero-card{background:linear-gradient(145deg,rgba(124,92,255,.16),rgba(255,255,255,.03));border:1px solid var(--border);border-radius:24px;padding:25px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.hero-card .big{font-size:48px}
.hero-card strong{font-size:22px}
.hero-card p{font-size:14px;margin:8px 0 0}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 28px}
.search{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:14px;outline:none}
.search:focus{border-color:var(--accent)}
.catalog-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}
.catalog-head h2{margin:0;font-size:30px}
.count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:90px}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:270px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:rgba(124,92,255,.4)}
.cover{height:150px;background:radial-gradient(circle at 50% 35%,rgba(124,92,255,.4),transparent 45%),linear-gradient(145deg,#17122d,#0b0d13);display:grid;place-items:center;position:relative}
.cover-icon{font-size:50px;filter:drop-shadow(0 8px 20px rgba(124,92,255,.25))}
.badge{position:absolute;top:11px;left:11px;font-size:11px;font-weight:800;padding:6px 8px;border-radius:9px;background:rgba(69,212,131,.12);color:var(--ok);border:1px solid rgba(69,212,131,.18)}
.card-body{padding:15px;display:flex;flex-direction:column;flex:1}
.game-name{font-weight:850;line-height:1.25;margin-bottom:8px}
.meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.add{margin-top:auto;width:100%}
.empty{grid-column:1/-1;padding:45px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--border);border-radius:18px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.drawer{position:fixed;right:0;top:0;height:100%;width:min(440px,94vw);background:#0d1017;border-left:1px solid var(--border);transform:translateX(100%);transition:.25s;z-index:31;padding:22px;display:flex;flex-direction:column}
.open .drawer-backdrop{opacity:1;pointer-events:auto}
.open .drawer{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.drawer h3{font-size:25px;margin:0}
.selected{flex:1;overflow:auto;margin:20px 0}
.selected-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.remove{border:0;background:transparent;color:var(--muted);cursor:pointer}
.drawer-footer{border-top:1px solid var(--border);padding-top:18px}
.drawer-footer p{color:var(--muted);font-size:13px;line-height:1.5}
footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted);font-size:13px}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.nav{height:64px}.hero{padding-top:50px}.grid{grid-template-columns:repeat(2,1fr);gap:11px}h1{letter-spacing:-2px}.card{min-height:255px}.cover{height:125px}.catalog-head{align-items:start;flex-direction:column}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.nav-actions .btn:first-child{display:none}}
</style>
</head>

const WHATSAPP_NUMBER = "5493434524653"; // Reemplazá esto por tu número, sin + ni espacios.
let selected = JSON.parse(localStorage.getItem("bootplay_selected") || "[]");

const grid = document.getElementById("grid");
const search = document.getElementById("search");
document.getElementById("heroCount").textContent = GAMES.length;
document.getElementById("year").textContent = new Date().getFullYear();

function save(){ localStorage.setItem("bootplay_selected", JSON.stringify(selected)); updateCount(); }
function updateCount(){ document.getElementById("cartCount").textContent = selected.length; }

function render(){
  const q = search.value.trim().toLowerCase();
  const list = GAMES.filter(g => g.name.toLowerCase().includes(q));
  document.getElementById("resultCount").textContent = `${list.length} juego${list.length===1?"":"s"}`;
  grid.innerHTML = "";
  
  if(!list.length){ 
      grid.innerHTML = '<div class="empty">No encontramos ese juego. Probá con otro nombre.</div>'; 
      return; 
  }
  
  list.forEach((g)=>{
    const exists = selected.includes(g.name);
    const card = document.createElement("article");
    card.className = "card";
    
    let portada = '<div class="cover-icon">🎮</div>';
    if (g.image) {
        portada = `<img src="${g.image}" alt="${escapeHtml(g.name)}" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0;">`;
    }

    card.innerHTML = `
      <div class="cover" style="cursor: pointer;">
        ${portada}
        <span class="badge" style="z-index:1;">● Disponible</span>
      </div>
      <div class="card-body">
        <div class="game-name" style="cursor: pointer;">${escapeHtml(g.name)}</div>
        <div class="meta">${escapeHtml(g.console)} · Formato: ${escapeHtml(g.format || 'Consultar')}</div>
        <button class="btn ${exists?"":"primary"} add">${exists?"✓ Agregado":"＋ Agregar al pedido"}</button>
      </div>`;
      
    // Al hacer clic en la tarjeta (portada o nombre), abre el modal de detalles
    card.querySelector(".cover").onclick = () => openGameModal(g);
    card.querySelector(".game-name").onclick = () => openGameModal(g);

    // El botón cumple su función de agregar/quitar directamente
    card.querySelector("button.add").onclick = (e) => {
      e.stopPropagation();
      toggle(g.name);
    };

    grid.appendChild(card);
  });
}

// Funciones para abrir y cerrar la ventana emergente de detalles
function openGameModal(g) {
  const exists = selected.includes(g.name);
  let modalPortada = '<div style="font-size: 60px;">🎮</div>';
  if (g.image) {
    modalPortada = `<img src="${g.image}" alt="${escapeHtml(g.name)}">`;
  }

  const descripcion = g.desc || `Juego disponible para PS3 (${g.format || 'HEN / No HEN'}). Seleccionalo para armar tu pedido y coordinar la instalación por WhatsApp.`;

  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-backdrop active" onclick="closeGameModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeGameModal()">✕</button>
        <div class="modal-img-container">
          ${modalPortada}
        </div>
        <div>
          <h3 class="modal-title">${escapeHtml(g.name)}</h3>
          <p style="font-size: 13px; color: var(--accent2); margin: 4px 0 10px 0;">Consola: ${escapeHtml(g.console)} | Formato: ${escapeHtml(g.format || 'Consultar')}</p>
          <p class="modal-desc">${escapeHtml(descripcion)}</p>
        </div>
        <button class="btn ${exists?"":"primary"}" style="width: 100%; padding: 12px;" onclick="toggleModalGame('${escapeHtml(g.name).replace(/'/g, "\\'")}')">
          ${exists?"✓ Quitar del pedido":"＋ Agregar al pedido"}
        </button>
      </div>
    </div>`;
}

function closeGameModal(e) {
  if (!e || e.target.classList.contains("modal-backdrop") || e.target.classList.contains("modal-close")) {
    document.getElementById("modalRoot").innerHTML = "";
  }
}

function toggleModalGame(name) {
  toggle(name);
  const gameObj = GAMES.find(x => x.name === name);
  if (gameObj) openGameModal(gameObj);
}

function toggle(name){
  if(selected.includes(name)) selected = selected.filter(x=>x!==name);
  else selected.push(name);
  save(); render();
}

function openCart(){
  document.body.classList.add("open");
  document.getElementById("drawerRoot").innerHTML = `
    <div class="drawer-backdrop" onclick="closeCart()"></div>
    <aside class="drawer">
      <div class="drawer-head"><h3>Tu pedido</h3><button class="btn" onclick="closeCart()">✕</button></div>
      <div class="selected">
        ${selected.length ? selected.map((name,i)=>`
          <div class="selected-item"><span>${escapeHtml(name)}</span><button class="remove" onclick="removeSelected(${i})">Quitar</button></div>
        `).join("") : '<div class="empty">Todavía no seleccionaste juegos.</div>'}
      </div>
      <div class="drawer-footer">
        <p>Al enviar, se abrirá WhatsApp con tu selección para que puedas consultar y coordinar el pedido.</p>
        <button class="btn primary" style="width:100%" onclick="sendWhatsApp()" ${selected.length?"":"disabled"}>📲 Enviar pedido por WhatsApp</button>
      </div>
    </aside>`;
}
function closeCart(){ document.body.classList.remove("open"); document.getElementById("drawerRoot").innerHTML=""; }
function removeSelected(i){ selected.splice(i,1); save(); openCart(); render(); }
function sendWhatsApp(){
  if(!selected.length) return;
  if(WHATSAPP_NUMBER.includes("X")){
    alert("Primero configurá tu número de WhatsApp en el archivo index.html.");
    return;
  }
  const text = "Hola Bootplay! Quiero consultar por estos juegos:%0A%0A" +
    selected.map((x,i)=>`${i+1}. ${encodeURIComponent(x)}`).join("%0A") +
    "%0A%0AQuedo atento.";
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

search.addEventListener("input", render);
updateCount(); 
render();
</script>
</body>
</html>
